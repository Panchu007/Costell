[project]
name = "costell"
version = "0.1.0"
description = "AI-powered cost estimation engine for the AI-native development era."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Panchu007", email = "your-email@example.com"}
]
dependencies = [
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "catboost>=1.2.0",
    "shap>=0.44.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlmodel>=0.0.16",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "pyarrow>=15.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "fpdf2>=2.7.0",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/costell"]


[tool.ruff]
line-length = 100
target-version = "py311"